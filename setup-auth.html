<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Setup – Crear usuario admin</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet"/>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyCxBeZMj2YQc9GL2BAC6-kqhJi6KeLCbng",
    authDomain: "talleres-muni.firebaseapp.com",
    projectId: "talleres-muni",
    storageBucket: "talleres-muni.firebasestorage.app",
    messagingSenderId: "354217649134",
    appId: "1:354217649134:web:cb1f1084dc107b1dd224ff"
  };

  const app  = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  window._createUser = async () => {
    const email    = document.getElementById('inp_email').value.trim();
    const password = document.getElementById('inp_pass').value;
    const out      = document.getElementById('out');

    if (!email || !password) {
      out.className = 'mt-5 text-sm font-semibold text-amber-600 bg-amber-50 border border-amber-200 rounded-xl p-4';
      out.textContent = '⚠️ Completá el correo y la contraseña antes de continuar.';
      return;
    }

    out.className = 'mt-5 text-sm font-semibold text-gray-500 bg-gray-50 border border-gray-200 rounded-xl p-4';
    out.textContent = '⏳ Creando usuario en Firebase...';

    try {
      const cred = await createUserWithEmailAndPassword(auth, email, password);
      out.className = 'mt-5 text-sm font-semibold text-green-700 bg-green-50 border border-green-200 rounded-xl p-4';
      out.innerHTML = `✅ <strong>Usuario creado:</strong> ${cred.user.email}<br/><br/>
        Ya podés <a href="login" style="color:#00a8e8;text-decoration:underline;">ir al login</a> e ingresar con ese correo y contraseña.<br/>
        <span style="opacity:0.7;">Después podés eliminar este archivo <code>setup-auth</code>.</span>`;
    } catch (e) {
      if (e.code === 'auth/email-already-in-use') {
        out.className = 'mt-5 text-sm font-semibold text-amber-700 bg-amber-50 border border-amber-200 rounded-xl p-4';
        out.innerHTML = `⚠️ Ese correo ya está registrado en Firebase Auth.<br/>
          Podés <a href="login" style="color:#00a8e8;text-decoration:underline;">ir al login</a> directamente.`;
      } else {
        out.className = 'mt-5 text-sm font-semibold text-red-700 bg-red-50 border border-red-200 rounded-xl p-4';
        out.textContent = '❌ Error: ' + e.message;
      }
    }
  };
</script>

<style>
  body { font-family: 'Montserrat', sans-serif; }
  input:focus { outline: none; border-color: #00a8e8 !important; box-shadow: 0 0 0 3px rgba(0,168,232,0.15); }
</style>
</head>

<body class="bg-[#f4f7fb] min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">

    <!-- Header -->
    <div class="flex flex-col items-center gap-3 mb-6">
      <div class="w-14 h-14 rounded-2xl bg-blue-100 flex items-center justify-center">
        <span class="material-icons text-[#00a8e8]" style="font-size:30px">build</span>
      </div>
      <h1 class="text-lg font-bold text-gray-900 text-center">Setup – Registrar usuario admin</h1>
      <p class="text-xs text-gray-500 text-center font-medium max-w-xs">
        Usá este formulario <strong>una sola vez</strong> para crear tu cuenta en Firebase. Después podés eliminarlo.
      </p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
      <div class="flex items-center gap-3 px-6 py-4 border-b border-gray-100 bg-gray-50">
        <div class="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center">
          <span class="material-icons text-[#00a8e8] text-[18px]">person_add</span>
        </div>
        <div>
          <p class="text-sm font-bold text-gray-800">Crear cuenta</p>
          <p class="text-[0.68rem] text-gray-400">Será el correo y contraseña de acceso al panel</p>
        </div>
      </div>

      <div class="p-6 space-y-4">
        <!-- Email -->
        <div>
          <label class="block text-[0.7rem] font-bold text-gray-400 uppercase tracking-wider mb-1.5">Correo electrónico</label>
          <div class="relative">
            <span class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-[18px] pointer-events-none">email</span>
            <input id="inp_email" type="email" placeholder="tu@correo.com" autocomplete="email"
              class="w-full rounded-xl border border-gray-200 bg-gray-50 text-sm pl-10 pr-4 py-2.5 text-gray-800 transition-all"/>
          </div>
        </div>

        <!-- Password -->
        <div>
          <label class="block text-[0.7rem] font-bold text-gray-400 uppercase tracking-wider mb-1.5">Contraseña</label>
          <div class="relative">
            <span class="material-icons absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-[18px] pointer-events-none">lock</span>
            <input id="inp_pass" type="password" placeholder="mínimo 6 caracteres" autocomplete="new-password"
              class="w-full rounded-xl border border-gray-200 bg-gray-50 text-sm pl-10 pr-4 py-2.5 text-gray-800 transition-all"/>
          </div>
        </div>

        <!-- Result -->
        <div id="out" class="hidden"></div>

        <!-- Button -->
        <button onclick="window._createUser()"
          class="w-full bg-[#00a8e8] hover:bg-[#0090c8] text-white rounded-xl font-bold flex items-center justify-center gap-2 px-6 py-3 shadow-md transition-all">
          <span class="material-icons text-[20px]">person_add</span>
          Registrar usuario en Firebase
        </button>

        <a href="login"
          class="flex items-center justify-center gap-1 text-sm font-semibold text-gray-400 hover:text-[#00a8e8] transition-colors mt-1">
          <span class="material-icons text-[16px]">arrow_back</span>
          Volver al login
        </a>
      </div>
    </div>

    <p class="text-center text-[0.65rem] text-gray-400 mt-4 font-medium">
      Eliminá este archivo después de crear tu cuenta.
    </p>
  </div>
</body>
</html>
